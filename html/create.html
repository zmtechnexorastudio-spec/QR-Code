<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code QR-Criar QR</title>
<link rel="shortcut icon" href="../assets/icone.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">


</head>
<body>

       <!--CABEÇAÇLHO-->

    <header id="header">
        <div class="logo">
<img src="../assets/icone.png" alt="logotipo">


<h1>
    <span class="code">Code</span>
     <span class="qr">QR</span>
</h1>
        </div>


        <div id="language-selector">
            <button id="btnPT">Português</button>
            <button id="btnEN">English</button>
        </div>
        <a href="../index.html" class="btn-secondary"  id="home">
            Home
        </a>
    </header>

    <main>
<!-- Título-->
 <section id="page-title">
    <h2 id="createQR">Criar QR Code</h2>

    <p id="choice">Escolha um tipo abaixo e preencha as informações.</p>
 </section>

 <!--TIPOS-->
 <section id="qr-types">

<div class="type-card active" data-type="text" id="text">Texto</div>
<div class="type-card" data-type="link">Link</div>
<div class="type-card" data-type="email">Email</div>
<div class="type-card" data-type="phone" id="phone">Telefone</div>




 </section>

<!--Layout Principal-->
<div id="create-layout">

<!--Coluna Esquerda-->
<div class="left-column">

<!--Formulario-->
<section id="form-section">
<h3 id="information">Informações</h3>

<input type="text" placeholder="Digite aqui" id="qrInput">

</section>


<!--PERSONALIZACAO-->
<section class="customization">
    <h3 id="customization">Personalização</h3>

    <label id="qrColorLabel">Cor do QR</label>
    <input type="color" id="qrColor" value="#00C853">

    
    <label id="backgroundColorLabel">Cor do Fundo</label>
    <input type="color" id="bgColor" value="#FFFFFF">

    
    <label id="sizeLabel">Tamanho</label>
    <input 
    type="range"
    id="qrSize"
     min="150"
      max="500"
      value="250">
      <span id="sizeValue">250px</span>

</section>
</div>

<!--Coluna Direita-->
<div class="right-column">
<!--Pre-Visualizacao-->
<section id="preview-section">
<h3 id="preview">Pré-visualização</h3>
<div id="qr-preview">
    <p id="placeholder">
        O seu QR Code aparecerá aqui.
    </p>
</div>

</section>

<!--Download-->
<button id="downloadPNG">
    <span id="downloadPNGText">Baixar como PNG</span>
</button>

<button id="downloadJPG">
    <span id="downloadJPGText">Baixar como JPG</span>
</button>

<button id="downloadPDF">
    <span id="downloadPDFText">Baixar como PDF</span>
</button>


</section>

</div>


</div>


<!--FEEDBACK-->

<section id="feedback">
    <h3 id="feedbackTitle">Gostou do Code QR?</h3>

    <p id="feedbackDescription">A sua opinião é importante para nós...</p>

    <textarea
        id="feedbackText"
        placeholder="Escreva aqui a sua opinião..."
        rows="5">
    </textarea>

    <button id="btnFeedback">
        Enviar Feedback
    </button>
</section>
    </main>

    <!--FOOTER-->
    <footer id="footer">
        <p>&copy;2026 Code QR</p>
        <p id="version">Versão v1.0</p>
        <p id="madeinangola">Feito em Angola</p>
    </footer>

    <script src="../libs/qrcode.min.js"></script>
    <script src="../libs/jspdf.umd.min.js"></script>
    <script src="../js/generator.js"></script>
    <script src="../js/customization.js"></script>
    <script src="../js/download.js"></script>
    <script src="../js/feedback.js"></script>
    <script src="../js/language-create.js"></script>
    <script src="../js/app.js"></script>


</body>
</html>
